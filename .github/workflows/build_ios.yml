name: Build iOS Release

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    name: Build iOS Release Package
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS App (Unsigned Release Bundle)
        run: flutter build ios --release --no-codesign

      - name: Package Payload as IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r ../../../PickleballSmash-Release.ipa Payload

      - name: Upload iOS Release IPA
        uses: actions/upload-artifact@v4
        with:
          name: PickleballSmash-Release-iOS
          path: PickleballSmash-Release.ipa

