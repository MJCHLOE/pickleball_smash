name: Build Flutter APK
on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-24.04 # Pinned to 24.04 to clear the Ubuntu 26 migration warning
    steps:
      - uses: actions/checkout@v4 # Updated to v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4 # Updated to v4 to fix the failure
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
