<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Pickleball Smash - Fast-Paced Retro Tennis & Pickleball Action Game">
  <meta name="theme-color" content="#0d1117">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pickleball Smash">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Pickleball Smash - Championship Edition</title>
  <link rel="manifest" href="manifest.json">

  <!-- Responsive & Game Engine Web Stylesheet -->
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 30%, #151d32 0%, #0a0d16 100%);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      position: fixed;
    }

    /* Crisp pixel-art scaling for 2D sprites & game canvas */
    canvas {
      image-rendering: -moz-crisp-edges;
      image-rendering: -webkit-crisp-edges;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      outline: none;
    }

    /* Interactive Loading Arena Screen */
    #loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 35%, #182442 0%, #090c15 100%);
      z-index: 99999;
      transition: opacity 0.5s ease-out;
      pointer-events: none;
    }

    .loader-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem;
      border-radius: 24px;
      background: rgba(18, 25, 43, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(0, 230, 118, 0.15);
      max-width: 90vw;
      width: 360px;
    }

    .ball-bounce-container {
      position: relative;
      width: 120px;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.5rem;
    }

    .pickleball {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #e9ff47 0%, #a2cc00 80%, #638000 100%);
      box-shadow: 0 0 25px rgba(218, 255, 59, 0.8), inset -2px -3px 6px rgba(0, 0, 0, 0.4);
      position: relative;
      animation: smashBounce 1.1s cubic-bezier(0.28, 0.84, 0.42, 1) infinite;
    }

    /* Pickleball holes */
    .pickleball::before,
    .pickleball::after {
      content: "";
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #536b00;
      box-shadow: 
        14px 6px 0 0 #536b00,
        -6px 12px 0 0 #536b00,
        10px 18px 0 0 #536b00,
        -2px 24px 0 0 #536b00,
        18px 24px 0 0 #536b00;
      top: 6px;
      left: 10px;
    }

    .court-shadow {
      position: absolute;
      bottom: 6px;
      width: 48px;
      height: 12px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.5);
      filter: blur(4px);
      animation: shadowScale 1.1s cubic-bezier(0.28, 0.84, 0.42, 1) infinite;
    }

    .loader-title {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #daff3b, #00e676);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
      text-align: center;
    }

    .loader-subtitle {
      font-size: 0.82rem;
      color: #90a4ae;
      letter-spacing: 0.05em;
      text-align: center;
    }

    .pulse-bar {
      margin-top: 1.25rem;
      width: 100%;
      height: 4px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
      position: relative;
    }

    .pulse-bar::after {
      content: "";
      position: absolute;
      left: -40%;
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, transparent, #00e676, #daff3b, transparent);
      border-radius: 4px;
      animation: loadingSlide 1.5s infinite ease-in-out;
    }

    @keyframes smashBounce {
      0%, 100% {
        transform: translateY(0px) scale(1.08, 0.92);
      }
      45% {
        transform: translateY(-42px) scale(0.95, 1.05);
      }
    }

    @keyframes shadowScale {
      0%, 100% {
        transform: scale(1.2);
        opacity: 0.7;
      }
      45% {
        transform: scale(0.6);
        opacity: 0.2;
      }
    }

    @keyframes loadingSlide {
      0% {
        left: -40%;
      }
      100% {
        left: 100%;
      }
    }

    /* Responsive Mobile Landscape & Portrait view helpers */
    @media screen and (max-width: 480px) {
      .loader-card {
        padding: 1.75rem;
        width: 85vw;
      }
      .loader-title {
        font-size: 1.15rem;
      }
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="loader-card">
      <div class="ball-bounce-container">
        <div class="court-shadow"></div>
        <div class="pickleball"></div>
      </div>
      <div class="loader-title">Pickleball Smash</div>
      <div class="loader-subtitle">Preparing Court & Sprites...</div>
      <div class="pulse-bar"></div>
    </div>
  </div>

  <script>
    // Automatically fade out the HTML loading screen once Flutter finishes mounting
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loading-container');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function () {
          loader.remove();
        }, 500);
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
